<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule | HL Pressure Washing</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="HL Pressure Washing home">
        <span class="brand-mark" aria-hidden="true"><svg><use href="assets/hl-burst.svg#burst"></use></svg></span>
        <span>HL Pressure Washing</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">
          <svg aria-hidden="true"><use href="assets/hl-burst.svg#burst"></use></svg>
          Home
        </a>
        <a class="nav-link" href="work.html">
          <svg aria-hidden="true"><use href="assets/hl-burst.svg#burst"></use></svg>
          Photos
        </a>
      </nav>
    </header>

    <main>
      <section class="page-title" aria-labelledby="schedule-title">
        <h1 id="schedule-title">Schedule</h1>
        <p>Send the job details and preferred timing for a fast estimate.</p>
      </section>

      <section class="page-grid">
        <form class="form-panel" id="schedule-request-form" action="mailto:hlpressurwashing@gmail.com,landon.paul.leblanc@gmail.com,moralfamily@gmail.com" method="post" enctype="text/plain">
          <div class="form-grid">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" autocomplete="tel" required>
            </div>
            <div class="field full">
              <label for="address">Service address</label>
              <input id="address" name="address" autocomplete="street-address">
            </div>
            <div class="field">
              <label for="service">Service</label>
              <select id="service" name="service">
                <option>Driveway cleaning</option>
                <option>Patio cleaning</option>
                <option>Siding wash</option>
                <option>Gutter cleaning</option>
                <option>Full exterior wash</option>
              </select>
            </div>
            <div class="field">
              <label for="date">Preferred date</label>
              <input id="date" name="preferred_date" type="date">
            </div>
            <div class="field">
              <label for="time">Preferred time</label>
              <select id="time" name="preferred_time">
                <option>Morning</option>
                <option>Afternoon</option>
                <option>Evening</option>
                <option>First available</option>
              </select>
            </div>
            <div class="field full">
              <label for="notes">Notes</label>
              <textarea id="notes" name="notes" placeholder="Gate codes, surface size, problem areas, or best time to call"></textarea>
            </div>
          </div>
          <div class="page-actions">
            <button class="button" type="submit">
              <svg aria-hidden="true"><use href="assets/hl-burst.svg#burst"></use></svg>
              Send request
            </button>
            <a class="button secondary" href="index.html">
              <svg aria-hidden="true"><use href="assets/hl-burst.svg#burst"></use></svg>
              Back home
            </a>
          </div>
        </form>

        <aside class="info-panel">
          <h2>Contact</h2>
          <div class="info-list">
            <div class="info-item">
              <button class="burst-button" type="button" aria-label="Spin icon for Landon contact"><svg aria-hidden="true"><use href="assets/hl-burst.svg#burst"></use></svg></button>
              <div><strong>Landon</strong><p><a href="tel:+13374519553">337-451-9553</a> | <a href="sms:+13374519553">Text Landon</a></p></div>
            </div>
            <div class="info-item">
              <button class="burst-button" type="button" aria-label="Spin icon for Hunter contact"><svg aria-hidden="true"><use href="assets/hl-burst.svg#burst"></use></svg></button>
              <div><strong>Hunter</strong><p><a href="tel:+13372583336">337-258-3336</a> | <a href="sms:+13372583336">Text Hunter</a></p></div>
            </div>
            <div class="info-item">
              <button class="burst-button" type="button" aria-label="Spin icon for email contact"><svg aria-hidden="true"><use href="assets/hl-burst.svg#burst"></use></svg></button>
              <div><strong>Email</strong><p><a href="mailto:hlpressurwashing@gmail.com,landon.paul.leblanc@gmail.com,moralfamily@gmail.com">Send a request</a></p></div>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="assets/site.js"></script>
</body>
</html>
