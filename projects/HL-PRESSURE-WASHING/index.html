<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HL Pressure Washing</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f8fb;
      color: #18232f;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(92vw, 720px);
      text-align: center;
      padding: 48px 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.25rem, 8vw, 5rem);
      line-height: 1;
    }

    p {
      margin: 0;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      color: #435466;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello world.</h1>
    <p>HL Pressure Washing is coming soon.</p>
  </main>
</body>
</html>
